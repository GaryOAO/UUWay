<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="UUWay：网易 UU 远程的 Linux 原生被控端，把 Linux 桌面串流到手机" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="0.55" stop-color="#101a36"/>
      <stop offset="1" stop-color="#0c1a2b"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="wallpaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e1065"/>
      <stop offset="0.6" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="420" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#grid)"/>
    <circle cx="1000" cy="130" r="360" fill="url(#glowCyan)"/>
    <circle cx="260" cy="420" r="380" fill="url(#glowViolet)"/>
  </g>

  <!-- words -->
  <rect x="72" y="62" width="236" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
  <circle cx="92" cy="77" r="4" fill="#34d399"/>
  <text x="104" y="82" font-size="14" fill="#cbd5e1">开源 · AGPL-3.0 · 开发者预览</text>
  <text x="70" y="174" font-size="80" font-weight="800" fill="url(#title)" letter-spacing="-1">UUWay</text>
  <text x="72" y="226" font-size="31" font-weight="700" fill="#f1f5f9">网易 UU 远程 · Linux 原生被控端</text>
  <text x="72" y="266" font-size="18" fill="#94a3b8">Wayland 原生　·　GPU 零拷贝　·　不再绕道 RDP</text>

  <g font-size="15" fill="#e2e8f0">
    <rect x="72" y="302" width="124" height="34" rx="17" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.45"/>
    <text x="134" y="324" text-anchor="middle">1080p 60 帧</text>
    <rect x="206" y="302" width="142" height="34" rx="17" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.45"/>
    <text x="277" y="324" text-anchor="middle">NVENC 硬件编码</text>
    <rect x="358" y="302" width="104" height="34" rx="17" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.45"/>
    <text x="410" y="324" text-anchor="middle">中文输入法</text>
    <rect x="472" y="302" width="90" height="34" rx="17" fill="#f472b6" fill-opacity="0.12" stroke="#f472b6" stroke-opacity="0.45"/>
    <text x="517" y="324" text-anchor="middle">远程终端</text>
    <rect x="572" y="302" width="120" height="34" rx="17" fill="#fb923c" fill-opacity="0.12" stroke="#fb923c" stroke-opacity="0.45"/>
    <text x="632" y="324" text-anchor="middle">剪贴板与文件</text>
  </g>

  <!-- monitor with the Linux desktop -->
  <rect x="742" y="78" width="352" height="232" rx="14" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <rect x="754" y="90" width="328" height="196" rx="6" fill="url(#wallpaper)"/>
  <rect x="754" y="90" width="328" height="12" rx="3" fill="#000000" fill-opacity="0.55"/>
  <circle cx="1068" cy="96" r="2.2" fill="#e5e7eb"/>
  <circle cx="1060" cy="96" r="2.2" fill="#e5e7eb"/>
  <rect x="908" y="93.5" width="28" height="5" rx="2.5" fill="#e5e7eb" fill-opacity="0.8"/>
  <rect x="754" y="102" width="22" height="184" fill="#000000" fill-opacity="0.35"/>
  <rect x="759" y="112" width="12" height="12" rx="3" fill="#f97316"/>
  <rect x="759" y="130" width="12" height="12" rx="3" fill="#38bdf8"/>
  <rect x="759" y="148" width="12" height="12" rx="3" fill="#22c55e"/>
  <rect x="759" y="166" width="12" height="12" rx="3" fill="#e5e7eb"/>
  <!-- terminal window -->
  <rect x="790" y="114" width="166" height="108" rx="6" fill="#0f172a" stroke="#475569"/>
  <rect x="790" y="114" width="166" height="14" rx="6" fill="#1e293b"/>
  <circle cx="800" cy="121" r="2.5" fill="#f87171"/>
  <circle cx="808" cy="121" r="2.5" fill="#fbbf24"/>
  <circle cx="816" cy="121" r="2.5" fill="#34d399"/>
  <rect x="800" y="138" width="16" height="5" rx="2" fill="#34d399"/>
  <rect x="820" y="138" width="70" height="5" rx="2" fill="#94a3b8"/>
  <rect x="800" y="150" width="110" height="5" rx="2" fill="#64748b"/>
  <rect x="800" y="162" width="92" height="5" rx="2" fill="#64748b"/>
  <rect x="800" y="174" width="16" height="5" rx="2" fill="#34d399"/>
  <rect x="820" y="174" width="44" height="5" rx="2" fill="#67e8f9"/>
  <rect x="800" y="186" width="6" height="8" fill="#e2e8f0"/>
  <!-- editor window -->
  <rect x="902" y="150" width="166" height="118" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="902" y="150" width="166" height="14" rx="6" fill="#e2e8f0"/>
  <rect x="914" y="176" width="90" height="6" rx="3" fill="#0f172a" fill-opacity="0.8"/>
  <rect x="914" y="190" width="136" height="5" rx="2.5" fill="#94a3b8"/>
  <rect x="914" y="202" width="120" height="5" rx="2.5" fill="#94a3b8"/>
  <rect x="914" y="214" width="128" height="5" rx="2.5" fill="#94a3b8"/>
  <rect x="914" y="232" width="60" height="18" rx="4" fill="#7c3aed"/>
  <!-- pointer -->
  <path d="M1000 226 l0 18 l5 -4.5 l3.6 7.5 l3 -1.4 l-3.6 -7.4 l6.6 -0.4 z" fill="#ffffff" stroke="#0f172a" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- stand -->
  <path d="M898 310 h40 l8 26 h-56 z" fill="#1e293b"/>
  <rect x="862" y="334" width="112" height="9" rx="4.5" fill="#334155"/>

  <!-- stream to the phone -->
  <path d="M1020 74 C 1060 20, 1140 18, 1170 110" fill="none" stroke="url(#flow)" stroke-width="12" stroke-opacity="0.16" stroke-linecap="round"/>
  <path d="M1020 74 C 1060 20, 1140 18, 1170 110" fill="none" stroke="url(#flow)" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
  <rect x="1046" y="18" width="108" height="24" rx="12" fill="#0b1220" stroke="#22d3ee" stroke-opacity="0.5"/>
  <text x="1100" y="35" font-size="12.5" text-anchor="middle" fill="#a5f3fc">H.264 / HEVC</text>

  <!-- phone -->
  <rect x="1112" y="118" width="124" height="246" rx="22" fill="#0b1220" stroke="#64748b" stroke-width="2.5"/>
  <rect x="1121" y="132" width="106" height="218" rx="14" fill="#111827"/>
  <rect x="1156" y="138" width="36" height="6" rx="3" fill="#000000"/>
  <rect x="1126" y="182" width="96" height="58" rx="3" fill="url(#wallpaper)"/>
  <rect x="1126" y="182" width="96" height="4" fill="#000000" fill-opacity="0.55"/>
  <rect x="1126" y="186" width="7" height="54" fill="#000000" fill-opacity="0.35"/>
  <rect x="1137" y="193" width="48" height="31" rx="2" fill="#0f172a" stroke="#475569" stroke-width="0.6"/>
  <rect x="1170" y="204" width="48" height="33" rx="2" fill="#f8fafc"/>
  <path d="M1190 220 l0 9 l2.5 -2.2 l1.8 3.7 l1.5 -0.7 l-1.8 -3.7 l3.3 -0.2 z" fill="#ffffff" stroke="#0f172a" stroke-width="0.7"/>
  <circle cx="1146" cy="300" r="12" fill="#1f2937" stroke="#334155"/>
  <circle cx="1174" cy="300" r="12" fill="#22d3ee" fill-opacity="0.9"/>
  <circle cx="1202" cy="300" r="12" fill="#1f2937" stroke="#334155"/>
  <rect x="1150" y="340" width="48" height="4" rx="2" fill="#475569"/>
</svg>
