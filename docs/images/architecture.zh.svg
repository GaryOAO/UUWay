<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="724" viewBox="0 0 1200 724" role="img" aria-label="UUWay 架构：UU 官方被控端在 Wine 中调用的每个 Windows 接口，都由 UUWay 交给 Linux 原生实现" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
