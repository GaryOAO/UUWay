name: 功能建议 / Feature request
description: 提议一个能让 UUWay 更好用的改进
title: "[功能] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 你遇到了什么限制？请说明使用场景。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案 / Proposed solution
      description: 你希望 UUWay 如何工作？如果有替代方案也请说明。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息 / Additional context
      description: 可附上环境、截图、相关 issue 或实现线索。
