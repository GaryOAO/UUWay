name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Package version for a test build (no release is created)
        default: 1.5.0~ci

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version and validate release notes
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            test -s packaging/release-notes.md
            grep -Fxq '## 中文' packaging/release-notes.md
            grep -Fxq '## English' packaging/release-notes.md
          else
            version="$INPUT_VERSION"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.+~][A-Za-z0-9.]+)?$ ]]
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
  packages:
    needs: version
    uses: ./.github/workflows/linux-packages.yml
    with:
      version: ${{ needs.version.outputs.version }}
  release:
    needs: [version, packages]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: uuway-*
          merge-multiple: true
          path: out
      - name: Assemble and check all release assets
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 - <<'PYTHON'
          import hashlib, os, pathlib
          version = os.environ['VERSION']
          root = pathlib.Path('out')
          arch_version = version.replace('~', '.').replace('+', '.')
          names = [f'uuway_{version}_amd64.deb', f'uuway_{version}_trixie_amd64.deb',
                   f'uuway-{version}-1.fedora.x86_64.rpm',
                   f'uuway-{arch_version}-1-x86_64.pkg.tar.zst']
          assert all((root / name).is_file() for name in names), names
          (root / 'SHA256SUMS').write_text(''.join(
              f'{hashlib.sha256((root / name).read_bytes()).hexdigest()}  {name}\n' for name in names))
          PYTHON
          cd out && sha256sum --strict -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: out/
      # Keep latest complete: upload every asset to a draft before publishing.
      - name: Create complete draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "UUWay ${GITHUB_REF_NAME#v}" --notes-file packaging/release-notes.md \
            out/uuway_*.deb out/uuway-*.rpm out/uuway-*.pkg.tar.zst out/SHA256SUMS
